openapi: 3.0.3

info:
  title: Credit Card Payment System API
  version: 1.0.0
  description: API documentation for the Credit Card Payment System.

servers:
  - url: http://localhost:8000
    description: Django API Server

tags:
  - name: Authentication
    description: User registration and JWT authentication
  - name: Cards
    description: Saved card management
  - name: Payments
    description: Payment processing and transaction history
  - name: Admin
    description: Administrator transaction operations

paths:

  /api/accounts/register/:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid registration data

  /api/accounts/login/:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticates a user and returns access and refresh JWT tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid username or password

  /api/accounts/token/refresh/:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Returns a new access token using a valid refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid or expired refresh token

  /api/accounts/me/:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Returns the authenticated user's information.
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required

  /api/accounts/logout/:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logs out the authenticated user by blacklisting the refresh token.
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
        '400':
          description: Invalid refresh token
        '401':
          description: Authentication required

  /api/cards/:
    post:
      tags:
        - Cards
      summary: Add a card
      description: Adds a card for the authenticated user. CVV is not stored.
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCardRequest'
      responses:
        '200':
          description: Card added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: Invalid card information
        '401':
          description: Authentication required

  /api/cards/my-cards/:
    get:
      tags:
        - Cards
      summary: Get my cards
      description: Returns cards belonging to the authenticated user.
      security:
        - jwtAuth: []
      responses:
        '200':
          description: List of saved cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: Authentication required

  /api/cards/{card_id}/:
    delete:
      tags:
        - Cards
      summary: Delete a card
      description: Deletes a saved card belonging to the authenticated user.
      security:
        - jwtAuth: []
      parameters:
        - name: card_id
          in: path
          required: true
          description: ID of the card to delete
          schema:
            type: integer
      responses:
        '204':
          description: Card deleted successfully
        '401':
          description: Authentication required
        '404':
          description: Card not found

  /api/payments/payments/:
    post:
      tags:
        - Payments
      summary: Make a payment
      description: Creates a payment and processes it through the FastAPI payment service.
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid payment information
        '401':
          description: Authentication required
        '503':
          description: Payment service unavailable

  /api/payments/history/:
    get:
      tags:
        - Payments
      summary: Get transaction history
      description: Returns the authenticated user's transactions with optional filters.
      security:
        - jwtAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by transaction status
          schema:
            type: string
            enum:
              - PENDING
              - SUCCESS
              - FAILED

        - name: min_amount
          in: query
          required: false
          description: Minimum transaction amount
          schema:
            type: number

        - name: max_amount
          in: query
          required: false
          description: Maximum transaction amount
          schema:
            type: number

        - name: start_date
          in: query
          required: false
          description: Transaction start date
          schema:
            type: string
            format: date

        - name: end_date
          in: query
          required: false
          description: Transaction end date
          schema:
            type: string
            format: date

      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Authentication required

  /api/payments/transactions/admin/export/:
    get:
      tags:
        - Admin
      summary: Export transactions as CSV
      description: Exports transaction records in CSV format for an administrator.
      security:
        - jwtAuth: []
      responses:
        '200':
          description: CSV file containing transaction records
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Authentication required
        '403':
          description: Administrator permission required

  /api/admin/summary/:
    get:
      tags:
        - Admin
      summary: Daily payment summary
      description: Displays the daily payment summary for administrators.
      responses:
        '200':
          description: Daily payment summary page
        '302':
          description: Redirect to Django admin login when authentication is required

components:

  securitySchemes:

    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: ramkumar
        email:
          type: string
          format: email
          example: ram@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          example: Test@12345
        first_name:
          type: string
          example: Ram
        last_name:
          type: string
          example: Kumar

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: ramkumar
        email:
          type: string
          format: email
          example: ram@gmail.com

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ramkumar
        password:
          type: string
          format: password
          example: Test@12345

    TokenResponse:
      type: object
      properties:
        access:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    TokenRefreshRequest:
      type: object
      required:
        - refresh
      properties:
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    AccessTokenResponse:
      type: object
      properties:
        access:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    LogoutRequest:
      type: object
      required:
        - refresh
      properties:
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    AddCardRequest:
      type: object
      required:
        - card_holder_name
        - card_number
        - cvv
        - expiry_month
        - expiry_year
      properties:
        card_holder_name:
          type: string
          example: Ram Kumar
        card_number:
          type: string
          example: "4111111111111111"
        cvv:
          type: string
          format: password
          example: "123"
        expiry_month:
          type: integer
          example: 12
        expiry_year:
          type: integer
          example: 2030

    Card:
      type: object
      properties:
        id:
          type: integer
          example: 1
        card_holder_name:
          type: string
          example: Ram Kumar
        masked_card_number:
          type: string
          example: "**** **** **** 1111"
        last_four:
          type: string
          example: "1111"
        expiry_month:
          type: integer
          example: 12
        expiry_year:
          type: integer
          example: 2030
        created_at:
          type: string
          format: date-time

    PaymentRequest:
      type: object
      required:
        - card_id
        - amount
      properties:
        card_id:
          type: integer
          example: 1
        amount:
          type: number
          format: decimal
          exclusiveMinimum: 0
          example: 500.00

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        payment_id:
          type: integer
          nullable: true
          example: 1
        card_id:
          type: integer
          example: 1
        amount:
          type: number
          example: 500.00
        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
          example: SUCCESS

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        card:
          type: integer
          nullable: true
          example: 1
        amount:
          type: string
          example: "500.00"
        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
          example: SUCCESS
        payment_id:
          type: integer
          nullable: true
          example: 1
        created_at:
          type: string
          format: date-time